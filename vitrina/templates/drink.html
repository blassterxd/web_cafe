{% extends "base.html" %}

{% block title %}{{ drink.name }}{% endblock %}

{% block content %}
<h1>{{ drink.name }}</h1>
<p>{{ drink.description }}</p>
<p>Объём — {{ drink.volume }} мл</p>
<p><strong>Цена — {{ drink.price }} ₽</strong></p>
<a href="{{ url_for('menu') }}">Вернуться в меню</a>
{% endblock %}
